name: Turas
options:
  bundleIdPrefix: com.turas
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

targets:
  Turas:
    type: application
    platform: iOS
    sources:
      - path: Turas
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Supporting/Info.plist
        # The ATS build phase below edits the built Info.plist in place,
        # which the user-script sandbox does not allow.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
    postBuildScripts:
      # Xcode does not expand build settings in Info.plist keys, so the App
      # Transport Security exception for a plain-HTTP server is written into
      # the built Info.plist here, keyed by $(TURAS_SERVER_HOST).
      - name: Add ATS exception for HTTP server
        path: Supporting/add-ats-exception.sh
        basedOnDependencyAnalysis: false
    configFiles:
      Debug: Configuration/Debug.xcconfig
      Release: Configuration/Release.xcconfig
    scheme:
      testTargets:
        - TurasTests
      gatherCoverageData: true

  TurasTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      # Fixtures/*.json are copied flat into the test bundle as resources.
      - path: TurasTests
    dependencies:
      - target: Turas
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
