name: Turas
options:
  bundleIdPrefix: com.turas
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

targets:
  Turas:
    type: application
    platform: iOS
    sources:
      - path: Turas
    info:
      path: Turas/Resources/Info.plist
      properties:
        CFBundleDisplayName: Turas
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        TURAS_SERVER_URL: $(TURAS_SERVER_URL)
        TURAS_SERVER_API_KEY: $(TURAS_SERVER_API_KEY)
        NSAppTransportSecurity:
          NSExceptionDomains:
            ${TURAS_SERVER_HOST}:
              NSExceptionAllowsInsecureHTTPLoads: true
        NSLocationWhenInUseUsageDescription: Turas uses your location to centre the map and show nearby buses.
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
    configFiles:
      Debug: Configuration/Debug.xcconfig
      Release: Configuration/Release.xcconfig
