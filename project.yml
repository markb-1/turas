name: Turas
options:
  bundleIdPrefix: com.turas
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

targets:
  Turas:
    type: application
    platform: iOS
    sources:
      - path: Turas
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Info.plist is maintained by hand, one per configuration, so the
        # App Transport Security exception for a plain-HTTP development
        # server ($(TURAS_SERVER_HOST)) exists in Debug builds only.
        # Keep the two files identical apart from NSAppTransportSecurity.
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          INFOPLIST_FILE: Supporting/Info-Debug.plist
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          INFOPLIST_FILE: Supporting/Info.plist
    configFiles:
      Debug: Configuration/Debug.xcconfig
      Release: Configuration/Release.xcconfig
    scheme:
      testTargets:
        - TurasTests
      gatherCoverageData: true

  TurasTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      # Fixtures/*.json are copied flat into the test bundle as resources.
      - path: TurasTests
    dependencies:
      - target: Turas
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
